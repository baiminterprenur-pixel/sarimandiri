<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aira AI BUMDes</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">

    <!-- LOGO -->
    <div class="logo-container">
      <img src="logo.png" alt="Logo Sari Mandiri" class="logo">
    </div>

    <!-- TEXT -->
    <div class="header-text">
      <h1>Aira AI</h1>
      <p>BUMDes Sari Mandiri</p>
    </div>

  </div>

  <!-- CHAT -->
  <div id="chat-box"></div>

  <!-- INPUT -->
  <div class="input-area">

    <input
      type="text"
      id="userInput"
      placeholder="Tulis pesan..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">
      ➤
    </button>

  </div>

  <!-- CLEAR -->
  <button class="clear-btn" onclick="clearChat()">
    Hapus Chat
  </button>

</div>

<script src="script.js"></script>

</body>
</html>
